name: DotLab
options:
  bundleIdPrefix: com.alperkaratas
  deploymentTarget:
    iOS: '17.0'
packages:
  DotLabCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '6.0'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  DotLab:
    type: application
    platform: iOS
    sources:
      - path: iOS/DotLab
    dependencies:
      - package: DotLabCore
        product: DotLabCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alperkaratas.dotlab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DotLab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
schemes:
  DotLab:
    build:
      targets:
        DotLab: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
